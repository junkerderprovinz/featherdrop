# Pushes the README to the Docker Hub overview on demand. build.yml does the
# same after a full multi-arch build; this run builds nothing, so a failing sync
# can be traced to the credential alone.
name: Docker Hub description

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Sync README to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Unlike build.yml there is no gate: a missing secret or a refused login
      # has to turn the run red.
      - name: Sync README to Docker Hub
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/featherdrop
          short-description: "A clean, login-free, self-hosted file sharer. Drop a file, set an expiry, share a link."
          enable-url-completion: true
