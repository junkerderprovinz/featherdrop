name: Release

# Creates a GitHub Release for every pushed vX.Y.Z tag, with the body from
# .github/release-notes/<tag>.md or generated notes when there is none. The
# release carries castleparcel-client.json, the hashes of the web client built
# from the tag, which scripts/verify-client.mjs checks a running instance
# against, and its text ends with the manifest's root hash.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

env:
  # Runs JavaScript actions on Node 24 and silences the Node 20 deprecation
  # warning.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "tag=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      # A manual run would otherwise check out the default branch, and the
      # manifest has to describe the tag.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc

      # reproducible.yml proves this build gives the same bytes on any machine,
      # and go.yml that the image embeds them.
      - name: Build the client and hash it
        id: client
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build:spa
          node scripts/client-manifest.mjs --out castleparcel-client.json
          root="$(jq -r .root castleparcel-client.json)"
          echo "root=${root}" >> "$GITHUB_OUTPUT"
          echo "Client root \`${root}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Locate release notes
        id: notes
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          FILE=".github/release-notes/${TAG}.md"
          if [ -f "${FILE}" ] && [ -s "${FILE}" ]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
            echo "notes_file=${FILE}" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release (manual changelog)
        if: steps.notes.outputs.has_notes == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          body_path: ${{ steps.notes.outputs.notes_file }}
          files: castleparcel-client.json
          fail_on_unmatched_files: true
          make_latest: true

      - name: Create release (auto-generated)
        if: steps.notes.outputs.has_notes == 'false'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: castleparcel-client.json
          fail_on_unmatched_files: true
          make_latest: true

      # Below the notes, so a reader sees the root without fetching the
      # manifest. A rerun finds the line already there.
      - name: Add the client root to the release text
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          ROOT: ${{ steps.client.outputs.root }}
        run: |
          set -euo pipefail
          body="${RUNNER_TEMP}/release-body.md"
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json body --jq .body > "${body}"
          if ! grep -qF "${ROOT}" "${body}"; then
            printf '\nClient root hash: `%s` (check an instance with scripts/verify-client.mjs, see docs/verifying-the-client.md)\n' "${ROOT}" >> "${body}"
            gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --notes-file "${body}"
          fi
