name: Release

# Create a GitHub Release whenever a semver tag (vX.Y.Z) is pushed. The release
# body comes from .github/release-notes/<tag>.md if present, otherwise notes are
# auto-generated.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Locate release notes
        id: notes
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          FILE=".github/release-notes/${TAG}.md"
          if [ -f "${FILE}" ] && [ -s "${FILE}" ]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
            echo "notes_file=${FILE}" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release (manual changelog)
        if: steps.notes.outputs.has_notes == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          body_path: ${{ steps.notes.outputs.notes_file }}
          make_latest: true

      - name: Create release (auto-generated)
        if: steps.notes.outputs.has_notes == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          make_latest: true
