name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Opt JS-based actions into Node 24 ahead of the 2026-06-16 forced switch,
  # silencing the Node 20 deprecation warning on checkout.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  eslint-typecheck:
    name: ESLint + Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # --ignore-scripts skips the better-sqlite3 native build — not needed to
      # lint or type-check, and keeps the job fast.
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: ESLint
        run: npm run lint

      - name: TypeScript typecheck
        run: npx tsc --noEmit

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Full install (native better-sqlite3 build) so the DB schema/migration
      # tests run for real, not skipped.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test
