name: Build & Push Docker Image

# Builds the multi-arch image and pushes :latest and :sha-<short> to GHCR on
# every push to main. With the DOCKERHUB_USERNAME variable and DOCKERHUB_TOKEN
# secret set it also pushes to docker.io/<DOCKERHUB_USERNAME>/featherdrop.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "templates/**"
      - ".github/release-notes/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  IMAGE_NAME: ghcr.io/junkerderprovinz/featherdrop
  # Runs JavaScript actions on Node 24 and silences the Node 20 deprecation
  # warning.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ env.IMAGE_NAME }}
            name=docker.io/${{ vars.DOCKERHUB_USERNAME }}/featherdrop,enable=${{ vars.DOCKERHUB_USERNAME != '' }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      # A green build only proves the image builds; the smoke test below proves
      # it starts before anything is pushed.
      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: featherdrop:smoke-amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build arm64 image for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: featherdrop:smoke-arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # :latest is multi-arch, so a green amd64 alone could still ship a broken
      # arm64 image. arm64 runs under QEMU and gets a larger boot budget.
      - name: Smoke test, both arches must boot and serve /
        run: |
          set -euo pipefail
          smoke() {
            local tag="$1" platform="$2" budget="$3"
            local name="fd-smoke-${platform##*/}"
            echo "::group::smoke ${platform}"
            docker run -d --name "$name" --platform "$platform" -p 3000:3000 "$tag"
            for i in $(seq 1 "$budget"); do
              if curl -fsS -o /dev/null http://localhost:3000/; then
                echo "✅ ${platform} served / after ${i}s"
                docker rm -f "$name" >/dev/null
                echo "::endgroup::"
                return 0
              fi
              sleep 1
            done
            echo "❌ ${platform} did not serve / within ${budget}s, logs:"
            docker logs "$name" || true
            docker rm -f "$name" >/dev/null
            echo "::endgroup::"
            return 1
          }
          smoke featherdrop:smoke-amd64 linux/amd64 40
          smoke featherdrop:smoke-arm64 linux/arm64 150

      # A fresh advisory should show up in the Security tab, not block a
      # release, so the scan never fails the build.
      - name: Scan image for CVEs (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: featherdrop:smoke-amd64
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy results to the Security tab
        if: ${{ github.event_name != 'pull_request' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Build & push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Mirrors the README to the Docker Hub overview. An access token with read,
      # write and delete scope can edit the description, while the account
      # password gets a 401 once 2FA is on.
      - name: Docker Hub description sync ready?
        id: dhdesc
        if: ${{ vars.DOCKERHUB_USERNAME != '' && github.event_name != 'pull_request' }}
        env:
          PW: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$PW" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "DOCKERHUB_TOKEN not set, skipping Docker Hub description sync"; echo "go=false" >> "$GITHUB_OUTPUT"; fi
      - name: Sync README to Docker Hub
        if: ${{ steps.dhdesc.outputs.go == 'true' }}
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/featherdrop
          short-description: "A clean, login-free, self-hosted file sharer. Drop a file, set an expiry, share a link."
          enable-url-completion: true
