name: Build & Push Docker Image

# Builds the multi-arch image and pushes it to GHCR. With the DOCKERHUB_USERNAME
# variable and DOCKERHUB_TOKEN secret set it also pushes to
# docker.io/<DOCKERHUB_USERNAME>/castleparcel. A push to main gets :edge and
# :sha-<short>. A vX.Y.Z tag gets :X.Y.Z, :X.Y, :X and :sha-<short>, plus :latest
# when it is the newest tag. The weekly cron and a manual run rebuild the newest
# release without the layer cache, under its version tags and :latest.

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "templates/**"
      - ".github/release-notes/**"
  # Weekly, to rebuild the newest release on fresh base images and packages.
  schedule:
    - cron: '0 8 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  IMAGE_NAME: ghcr.io/junkerderprovinz/castleparcel
  # Runs JavaScript actions on Node 24 and silences the Node 20 deprecation
  # warning.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Rebuilds refresh the newest release, which is what people run, not the
  # tip of main.
  release:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.newest.outputs.tag }}
      sha: ${{ steps.newest.outputs.sha }}
    steps:
      - name: Find the newest release
        id: newest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          echo "rebuilding $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)" >> "$GITHUB_OUTPUT"

  # Only a release tag has to carry the newest GlimStone. Main, branches and the
  # weekly rebuild build what is already there.
  glimstone:
    if: github.ref_type == 'tag'
    uses: junkerderprovinz/junkerderprovinz/.github/workflows/glimstone-current.yml@main

  build:
    needs: [release, glimstone]
    if: ${{ !failure() && !cancelled() }}
    name: Build & Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # latest moves only for the newest tag, so re-cutting an older version
      # cannot drag it backwards. checkout fetches no tags, and sort -V puts
      # v8.10.0 after v8.9.0, but also v8.10.0-rc1 after v8.10.0, so only tags
      # this workflow builds count.
      - name: Is this the newest release tag?
        id: newest
        if: github.ref_type == 'tag'
        run: |
          git fetch --tags --force --quiet
          newest=$(git tag -l | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          echo "this tag: ${GITHUB_REF_NAME}"
          echo "newest:   ${newest}"
          if [ "$newest" = "${GITHUB_REF_NAME}" ]; then
            echo "is_newest=true" >> "$GITHUB_OUTPUT"
            echo "-> this build moves :latest"
          else
            echo "is_newest=false" >> "$GITHUB_OUTPUT"
            echo "-> this build leaves :latest where it is"
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ env.IMAGE_NAME }}
            name=docker.io/${{ vars.DOCKERHUB_USERNAME }}/castleparcel,enable=${{ vars.DOCKERHUB_USERNAME != '' }}
          # latest is the newest release, so an unreleased merge never reaches
          # people who pull it, and a rebuild of that release moves it too. The
          # tip of main goes to edge. The action adds latest on its own for any
          # semver tag unless the flavor turns that off.
          #
          # {{major}} and {{major}}.{{minor}} follow whichever tag built last, so
          # re-cutting an old version moves them back. After that, re-run the
          # newest tag's build.
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=sha-,format=short,enable=${{ needs.release.outputs.tag == '' }}
            type=raw,value=edge,enable=${{ github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch && needs.release.outputs.tag == '' }}
            type=raw,value=latest,enable=${{ (github.ref_type == 'tag' && steps.newest.outputs.is_newest == 'true') || needs.release.outputs.tag != '' }}
            type=semver,pattern={{version}},value=${{ needs.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.release.outputs.tag }}
          # A rebuild of the newest release carries the release's commit, not main's.
          labels: |
            ${{ needs.release.outputs.tag != '' && format('org.opencontainers.image.revision={0}', needs.release.outputs.sha) || '' }}

      # A green build only proves the image builds; the smoke test below proves
      # it starts before anything is pushed.
      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: castleparcel:smoke-amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache: ${{ needs.release.outputs.tag != '' }}

      - name: Build arm64 image for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: castleparcel:smoke-arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache: ${{ needs.release.outputs.tag != '' }}

      # :latest is multi-arch, so a green amd64 alone could still ship a broken
      # arm64 image. arm64 runs under QEMU and gets a larger boot budget.
      - name: Smoke test, both arches must boot and serve /
        run: |
          set -euo pipefail
          smoke() {
            local tag="$1" platform="$2" budget="$3"
            local name="fd-smoke-${platform##*/}"
            echo "::group::smoke ${platform}"
            docker run -d --name "$name" --platform "$platform" -p 3000:3000 "$tag"
            for i in $(seq 1 "$budget"); do
              if curl -fsS -o /dev/null http://localhost:3000/; then
                echo "✅ ${platform} served / after ${i}s"
                docker rm -f "$name" >/dev/null
                echo "::endgroup::"
                return 0
              fi
              sleep 1
            done
            echo "❌ ${platform} did not serve / within ${budget}s, logs:"
            docker logs "$name" || true
            docker rm -f "$name" >/dev/null
            echo "::endgroup::"
            return 1
          }
          smoke castleparcel:smoke-amd64 linux/amd64 40
          smoke castleparcel:smoke-arm64 linux/arm64 150

      # A fresh advisory should show up in the Security tab, not block a
      # release, so the scan never fails the build.
      - name: Scan image for CVEs (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: castleparcel:smoke-amd64
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy results to the Security tab
        if: ${{ github.event_name != 'pull_request' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Build & push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache: ${{ needs.release.outputs.tag != '' }}

      # Mirrors the README to the Docker Hub overview. An access token with read,
      # write and delete scope can edit the description, while the account
      # password gets a 401 once 2FA is on.
      - name: Docker Hub description sync ready?
        id: dhdesc
        if: ${{ vars.DOCKERHUB_USERNAME != '' && github.event_name != 'pull_request' }}
        env:
          PW: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$PW" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "DOCKERHUB_TOKEN not set, skipping Docker Hub description sync"; echo "go=false" >> "$GITHUB_OUTPUT"; fi
      - name: Sync README to Docker Hub
        if: ${{ steps.dhdesc.outputs.go == 'true' }}
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/castleparcel
          short-description: "A clean, login-free, self-hosted file sharer. Drop a file, set an expiry, share a link."
          enable-url-completion: true
