name: Build & Push Docker Image

# Builds the multi-arch image from the Dockerfile and pushes it to GHCR on every
# push to main (and manually). Tags: :latest and :sha-<short>. Also mirrors to
# Docker Hub (docker.io/<DOCKERHUB_USERNAME>/featherdrop) once the
# DOCKERHUB_USERNAME variable + DOCKERHUB_TOKEN secret are set together; until
# then the build stays GHCR-only.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "templates/**"
      - ".github/release-notes/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/junkerderprovinz/featherdrop
  # Opt JS-based actions into Node 24 ahead of the 2026-06-16 forced switch,
  # silencing the Node 20 deprecation warning on checkout/docker actions.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub mirror — active only once DOCKERHUB_USERNAME (variable) and
      # DOCKERHUB_TOKEN (secret) are set together; otherwise skipped (GHCR-only).
      - name: Log in to Docker Hub
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE_NAME }}
            name=docker.io/${{ vars.DOCKERHUB_USERNAME }}/featherdrop,enable=${{ vars.DOCKERHUB_USERNAME != '' }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      # Smoke-test gate: build the amd64 image, boot it, and require it to serve /
      # before anything is pushed. A green Docker build only proves the image
      # *builds* — this proves it actually *starts* (catches a custom-server /
      # native-addon / standalone-trace crash that would otherwise reach :latest).
      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: featherdrop:smoke-amd64
          cache-from: type=gha

      - name: Build arm64 image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: featherdrop:smoke-arm64
          cache-from: type=gha

      # Boot BOTH published arches before anything is pushed — :latest is
      # multi-arch, so a green amd64 alone would still let a broken arm64 image
      # (e.g. its QEMU-built better-sqlite3 addon) reach :latest. arm64 runs
      # under QEMU emulation here, so it gets a larger boot budget.
      - name: Smoke test — both arches must boot and serve /
        run: |
          set -euo pipefail
          smoke() {
            local tag="$1" platform="$2" budget="$3"
            local name="fd-smoke-${platform##*/}"
            echo "::group::smoke ${platform}"
            docker run -d --name "$name" --platform "$platform" -p 3000:3000 "$tag"
            for i in $(seq 1 "$budget"); do
              if curl -fsS -o /dev/null http://localhost:3000/; then
                echo "✅ ${platform} served / after ${i}s"
                docker rm -f "$name" >/dev/null
                echo "::endgroup::"
                return 0
              fi
              sleep 1
            done
            echo "❌ ${platform} did not serve / within ${budget}s — logs:"
            docker logs "$name" || true
            docker rm -f "$name" >/dev/null
            echo "::endgroup::"
            return 1
          }
          smoke featherdrop:smoke-amd64 linux/amd64 40
          smoke featherdrop:smoke-arm64 linux/arm64 150

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
