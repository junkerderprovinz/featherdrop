name: Build & Push Docker Image

# Builds the multi-arch image from the Dockerfile and pushes it to GHCR on every
# push to main (and manually). Tags: :latest and :sha-<short>. Also mirrors to
# Docker Hub (docker.io/<DOCKERHUB_USERNAME>/featherdrop) once the
# DOCKERHUB_USERNAME variable + DOCKERHUB_TOKEN secret are set together; until
# then the build stays GHCR-only.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "templates/**"
      - ".github/release-notes/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  IMAGE_NAME: ghcr.io/junkerderprovinz/featherdrop
  # Opt JS-based actions into Node 24 ahead of the 2026-06-16 forced switch,
  # silencing the Node 20 deprecation warning on checkout/docker actions.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub mirror — active only once DOCKERHUB_USERNAME (variable) and
      # DOCKERHUB_TOKEN (secret) are set together; otherwise skipped (GHCR-only).
      - name: Log in to Docker Hub
        if: ${{ vars.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ env.IMAGE_NAME }}
            name=docker.io/${{ vars.DOCKERHUB_USERNAME }}/featherdrop,enable=${{ vars.DOCKERHUB_USERNAME != '' }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      # Smoke-test gate: build the amd64 image, boot it, and require it to serve /
      # before anything is pushed. A green Docker build only proves the image
      # *builds* — this proves it actually *starts* (catches a custom-server /
      # native-addon / standalone-trace crash that would otherwise reach :latest).
      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: featherdrop:smoke-amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build arm64 image for smoke test
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: featherdrop:smoke-arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Boot BOTH published arches before anything is pushed — :latest is
      # multi-arch, so a green amd64 alone would still let a broken arm64 image
      # (e.g. its QEMU-built better-sqlite3 addon) reach :latest. arm64 runs
      # under QEMU emulation here, so it gets a larger boot budget.
      - name: Smoke test — both arches must boot and serve /
        run: |
          set -euo pipefail
          smoke() {
            local tag="$1" platform="$2" budget="$3"
            local name="fd-smoke-${platform##*/}"
            echo "::group::smoke ${platform}"
            docker run -d --name "$name" --platform "$platform" -p 3000:3000 "$tag"
            for i in $(seq 1 "$budget"); do
              if curl -fsS -o /dev/null http://localhost:3000/; then
                echo "✅ ${platform} served / after ${i}s"
                docker rm -f "$name" >/dev/null
                echo "::endgroup::"
                return 0
              fi
              sleep 1
            done
            echo "❌ ${platform} did not serve / within ${budget}s — logs:"
            docker logs "$name" || true
            docker rm -f "$name" >/dev/null
            echo "::endgroup::"
            return 1
          }
          smoke featherdrop:smoke-amd64 linux/amd64 40
          smoke featherdrop:smoke-arm64 linux/arm64 150

      # Non-blocking CVE scan of the locally-built amd64 image. Reports HIGH/CRITICAL
      # (fixable only) to the Security tab; exit-code stays 0 so it never fails the
      # build — a fresh advisory should surface, not block a release.
      - name: Scan image for CVEs (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: featherdrop:smoke-amd64
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy results to the Security tab
        if: ${{ github.event_name != 'pull_request' }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Build & push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Mirror the GitHub README to the Docker Hub repo's Overview.
      #
      # This uses DOCKERHUB_TOKEN, the same access token the push above uses.
      # It used to use a separate DOCKERHUB_PASSWORD, on the belief that a push
      # token cannot edit a description. That was measured wrong on 2026-09-05:
      # an access token with read, write and delete scope edits it fine, while
      # the account password is refused outright with 401, because Docker Hub's
      # legacy login endpoint rejects a password once 2FA is on. One secret,
      # and the one that actually works.
      - name: Docker Hub description sync ready?
        id: dhdesc
        if: ${{ vars.DOCKERHUB_USERNAME != '' && github.event_name != 'pull_request' }}
        env:
          PW: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$PW" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "DOCKERHUB_TOKEN not set — skipping Docker Hub description sync"; echo "go=false" >> "$GITHUB_OUTPUT"; fi
      - name: Sync README to Docker Hub
        if: ${{ steps.dhdesc.outputs.go == 'true' }}
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/featherdrop
          short-description: "A clean, login-free, self-hosted file sharer. Drop a file, set an expiry, share a link."
          enable-url-completion: true
