name: E2E

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  e2e:
    name: Zero-knowledge round trip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Start server + run E2E
        env:
          NODE_ENV: development
          PORT: "3000"
          DATA_DIR: /tmp/fd-e2e-data
          BASE_URL: http://localhost:3000
          E2E_BASE_URL: http://localhost:3000
        run: |
          set -e
          mkdir -p /tmp/fd-e2e-data
          npm start > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          echo "server pid $SERVER_PID"
          # wait for the server to accept connections (max 60s)
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/ >/dev/null; then echo "server up"; break; fi
            if ! kill -0 $SERVER_PID 2>/dev/null; then echo "server died early"; cat /tmp/server.log; exit 1; fi
            sleep 1
          done
          node test/e2e/run.mjs
          STATUS=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $STATUS

      - name: Server log (on failure)
        if: failure()
        run: cat /tmp/server.log || true
