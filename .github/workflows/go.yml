name: Go backend (build · test · smoke)

# Tests the Go server and the SPA it embeds: vet and tests, a boot smoke of the
# native binary and of the image, and the browser e2e. It never pushes; only
# build.yml publishes.

on:
  push:
    branches: [main]
    paths:
      - "server-go/**"
      - "src/**"
      - "components/**"
      - "lib/**"
      - "app/**"
      - "public/**"
      - "index.html"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - "scripts/build-client.mjs"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/go.yml"
  # Safe on pull requests because nothing is pushed.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  go-test:
    name: vet · gofmt · test · native smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-go
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: server-go/go.mod

      - name: gofmt (must be clean)
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"; echo "$unformatted"; exit 1
          fi
          echo "gofmt clean"

      - name: go vet
        run: CGO_ENABLED=0 go vet ./...

      - name: go test
        run: CGO_ENABLED=0 go test ./... -count=1

      # A known CVE in a dependency or the standard library fails the build.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      # The placeholder webroot is enough to prove the server starts, opens the
      # database and serves /healthz.
      - name: Native boot smoke
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go build -o /tmp/fd-go .
          DATA_DIR="$(mktemp -d)" PORT=38080 /tmp/fd-go &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null "http://127.0.0.1:38080/healthz"; then
              echo "✅ /healthz up after ${i}s"; break
            fi
            sleep 1
            if [ "$i" = 30 ]; then echo "❌ /healthz never came up"; exit 1; fi
          done
          body="$(curl -fsS http://127.0.0.1:38080/healthz)"
          [ "$body" = "ok" ] || { echo "❌ /healthz body='$body' (want 'ok')"; exit 1; }
          echo "✅ native binary healthy"

  docker-smoke:
    name: build + boot the image (amd64 smoke, no push)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      # amd64 only; build.yml boots arm64 before it publishes.
      - name: Build image (amd64, no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: featherdrop-go:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A green build only proves the image builds; the SPA shell and the API
      # have to answer too.
      - name: Boot smoke, server must serve /healthz, / and /api/config
        run: |
          set -euo pipefail
          docker run -d --name fd-go -p 3000:3000 featherdrop-go:smoke
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:3000/healthz; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then echo "❌ /healthz never came up, logs:"; docker logs fd-go || true; docker rm -f fd-go; exit 1; fi
          echo "✅ /healthz: $(curl -fsS http://localhost:3000/healthz)"
          code_root="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/)"
          code_cfg="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/config)"
          echo "/ -> $code_root ; /api/config -> $code_cfg"
          docker rm -f fd-go >/dev/null
          [ "$code_root" = 200 ] && [ "$code_cfg" = 200 ] || { echo "❌ endpoint check failed"; exit 1; }
          echo "✅ Go image boots and serves the SPA shell + API"

  browser-e2e:
    name: browser e2e (real Chromium) against the Go server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: server-go/go.mod

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Runs the browser round trip in test/e2e/run.mjs against the Go server:
      # seekable upload, multi-file and inline preview with the real client
      # crypto.
      - name: Build SPA + Go binary, run browser e2e against Go
        env:
          PORT: "3000"
          DATA_DIR: /tmp/fd-go-e2e
          BASE_URL: http://localhost:3000
          E2E_BASE_URL: http://localhost:3000
        run: |
          set -e
          npm run build:spa
          ( cd server-go && CGO_ENABLED=0 go build -o /tmp/fd-go . )
          mkdir -p /tmp/fd-go-e2e
          /tmp/fd-go > /tmp/go-server.log 2>&1 &
          SRV=$!
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/healthz >/dev/null; then echo "Go server up"; break; fi
            if ! kill -0 "$SRV" 2>/dev/null; then echo "Go server died early"; cat /tmp/go-server.log; exit 1; fi
            sleep 1
          done
          curl -sf http://localhost:3000/healthz >/dev/null || { echo "Go server never came up"; cat /tmp/go-server.log; exit 1; }
          node test/e2e/run.mjs
          kill "$SRV" 2>/dev/null || true

      - name: Go server log (on failure)
        if: failure()
        run: cat /tmp/go-server.log || true
